<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>f/stop Photography</title>
		<meta name="description" content="Photographs from the world around us — a portfolio by f/stop Photography." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="assets/css/site.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload-0 is-preload-1 is-preload-2">
		<div id="main">
			<header id="header">
				<p class="eyebrow">Photography</p>
				<h1>f/stop</h1>
				<p class="lede">Photographs from the world around us.</p>
				<p class="count">{{count}} {{countLabel}}</p>
				<ul class="icons">
					<li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>
					<li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
					<li><a href="#" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
				</ul>
			</header>

			<section id="thumbnails">
				{{thumbnails}}
			</section>

			<footer id="footer">
				<ul class="copyright">
					<li>&copy; {{year}} f/stop Photography</li>
					<li>Layout inspired by <a href="https://html5up.net/lens">Lens</a></li>
				</ul>
			</footer>
		</div>

		<script src="assets/js/gallery.js"></script>
	</body>
</html>
