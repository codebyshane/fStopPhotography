<!DOCTYPE html>
<html lang="en" class="is-void">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<title>{{seriesTitle}} — f/stop</title>
		<meta name="description" content="{{seriesDescription}}" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/assets/css/site.css" />
	</head>
	<body class="page-series">
		<header class="mast mast-over">
			<a class="wordmark" href="/">f/stop</a>
			<p class="mast-series"><span>{{seriesKicker}}</span> {{seriesTitle}}</p>
			<nav>
				<a href="/#work">Work</a>
				<a href="/about">About</a>
			</nav>
		</header>

		<div id="viewer" class="series-viewer">
			<button class="nav-previous" type="button" aria-label="Previous photograph"></button>
			<button class="nav-next" type="button" aria-label="Next photograph"></button>
			<div class="slide">
				<div class="backdrop"></div>
				<div class="image"></div>
			</div>
			<div class="series-caption">
				<p class="counter" id="counter"></p>
				<h1 id="photo-title"></h1>
				<p id="photo-location"></p>
			</div>
		</div>

		<div class="filmstrip-wrap">
			<button class="strip-toggle" type="button" id="strip-toggle">Index</button>
			<div class="filmstrip" id="filmstrip">
				{{filmstrip}}
			</div>
		</div>

		<script type="application/json" id="series-data">{{seriesData}}</script>
		<script src="/assets/js/series.js"></script>
	</body>
</html>
