<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<title>Studio</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/assets/css/site.css" />
	</head>
	<body class="studio-auth">
		<main class="login-card">
			<p class="eyebrow">Private</p>
			<h1>f/stop</h1>
			<p class="lede">Sign in to the studio.</p>
			{{error}}
			<form class="login-form" method="post" action="{{adminPath}}/login">
				<label>
					<span>Username</span>
					<input type="text" name="username" autocomplete="username" required autofocus />
				</label>
				<label>
					<span>Password</span>
					<input type="password" name="password" autocomplete="current-password" required />
				</label>
				<button type="submit">Enter</button>
			</form>
		</main>
	</body>
</html>
