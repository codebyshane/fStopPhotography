<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<title>Studio</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/assets/css/site.css" />
	</head>
	<body class="studio-app">
		<header class="studio-bar">
			<div>
				<p class="eyebrow">Studio</p>
				<h1>f/stop</h1>
			</div>
			<div class="studio-bar-actions">
				<span class="signed-in">Signed in as {{username}}</span>
				<a class="text-link" href="/" target="_blank" rel="noopener">View gallery</a>
				<form method="post" action="{{adminPath}}/logout">
					<button type="submit" class="ghost">Sign out</button>
				</form>
			</div>
		</header>

		<main class="studio-layout">
			<section class="studio-panel" aria-labelledby="upload-heading">
				<h2 id="upload-heading">Add a photograph</h2>
				<p class="lede">Upload a new image whenever a frame is worthy of the gallery.</p>
				<form id="upload-form" class="upload-form">
					<label class="dropzone" id="dropzone">
						<input id="photo-input" type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif,image/heic" required />
						<span class="dropzone-copy">
							<strong>Drop a photograph here</strong>
							<span>or click to choose a JPEG, PNG, or WebP</span>
						</span>
						<img id="upload-preview" alt="" hidden />
					</label>
					<label>
						<span>Title</span>
						<input type="text" name="title" maxlength="120" placeholder="Laguna Sunset" required />
					</label>
					<label>
						<span>Location</span>
						<input type="text" name="location" maxlength="160" placeholder="Laguna Beach, California" />
					</label>
					<p id="upload-status" class="status" role="status"></p>
					<button type="submit">Add to gallery</button>
				</form>
			</section>

			<section class="studio-panel studio-library" aria-labelledby="library-heading">
				<div class="library-head">
					<h2 id="library-heading">Gallery</h2>
					<p class="lede" id="library-count"></p>
				</div>
				<p id="library-status" class="status" role="status"></p>
				<ol id="photo-list" class="photo-list"></ol>
			</section>
		</main>

		<script src="/assets/js/studio.js"></script>
	</body>
</html>
